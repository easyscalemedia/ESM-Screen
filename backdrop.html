<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESM Backdrop</title>
  <meta name="robots" content="noindex" />
  <!--
    The backdrop as a page, meant to be dropped into another project in ONE line:

      <iframe src="https://easyscalemedia.github.io/ESM-Screen/backdrop.html?follow=1"
              style="position:fixed;inset:0;width:100%;height:100%;border:0"
              sandbox="allow-scripts" loading="eager"></iframe>

    Everything then lives here: the images, the per-image motion, the code, and the
    settings pushed from remote.html. The other project never copies a file and
    never updates anything. The browser keeps this page in its own origin, so
    nothing in here can read or touch the page that embeds it — `sandbox="allow-scripts"`
    also stops it navigating the parent. (Self-hosting the two files from
    embed/ is still the option to pick when the screen must work with the ESM
    site unreachable.)

    Query parameters (all optional):
      follow=1            mirror the house config: rotation, playlist, pin, palette, movement
      interval=3          minutes per image, when not following
      motion=gentle       off | subtle | gentle | lively
      palette=orange      orange | navy | electric | teal | purple
      disc=0              hide the ESM disc
      discsize=60vmin     any CSS length
      wordmark=Easy Scale|Media
      categories=space,earth,nature,abstract
      start=52-space-andromeda      pin one image
      vignette=0          drop the soft dark edges
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="embed/esm-backdrop.css" />
  <link rel="stylesheet" href="backdrop.css" />
</head>
<body>
  <script src="embed/esm-backdrop.js"></script>
  <script src="backdrop.js"></script>
</body>
</html>
