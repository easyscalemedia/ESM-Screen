name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Image tooling (thumbnails + per-image motion)
        # Exact versions, wheels only: no unpinned upgrade and no sdist build
        # script runs in the job that holds the Pages deploy token.
        run: |
          python3 -m pip install --quiet --only-binary=:all: pillow==13.0.0 numpy==2.5.4 \
            || echo "Pillow/numpy unavailable — thumbnails and motion for new slides will be skipped"

      - name: Assemble site (+ stamp version for auto-refresh)
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js shared.js wall-background.js remote.html backdrop.html backdrop.js backdrop.css _site/
          # cache-bust JS/CSS per deploy so TV browsers can't serve a stale copy
          sed -i "s#app\.js\"#app.js?v=${GITHUB_SHA::7}\"#; s#shared\.js\"#shared.js?v=${GITHUB_SHA::7}\"#; s#wall-background\.js\"#wall-background.js?v=${GITHUB_SHA::7}\"#; s#styles\.css\"#styles.css?v=${GITHUB_SHA::7}\"#" _site/index.html
          cp -r assets/. _site/assets/ 2>/dev/null || true
          # the drop-in pack (embed/): served as-is, plus one zip with the images for other projects
          mkdir -p _site/embed _pack/esm-backdrop/slides
          cp embed/esm-backdrop.js embed/esm-backdrop.css embed/demo.html embed/README.md embed/fetch-slides.sh _site/embed/
          cp embed/esm-backdrop.js embed/esm-backdrop.css embed/demo.html embed/README.md embed/fetch-slides.sh _pack/esm-backdrop/
          cp assets/slides/* _pack/esm-backdrop/slides/ 2>/dev/null || true
          cp assets/motion.json _pack/esm-backdrop/motion.json 2>/dev/null || true
          python3 - <<'PY'
          import os, json
          d = '_site/assets/slides'; t = '_site/assets/thumbs'
          files = sorted(f for f in os.listdir(d)) if os.path.isdir(d) else []
          files = [f for f in files if f.lower().endswith(('.jpg', '.jpeg', '.png', '.webp'))]
          json.dump([f"assets/slides/{f}" for f in files], open('_site/assets/backgrounds.json', 'w'))
          print('backgrounds.json ->', len(files), 'slides')
          # the pack's manifest points at its own slides/ folder
          json.dump([f"slides/{f}" for f in files], open('_pack/esm-backdrop/backgrounds.json', 'w'), indent=1)
          # a 480x270 thumbnail for every slide that lacks one (the gallery in the panel/remote)
          try:
              from PIL import Image
              os.makedirs(t, exist_ok=True)
              made = 0
              for f in files:
                  out = os.path.join(t, os.path.splitext(f)[0] + '.jpg')
                  if os.path.exists(out): continue
                  im = Image.open(os.path.join(d, f)).convert('RGB').resize((480, 270), Image.LANCZOS)
                  im.save(out, 'JPEG', quality=78, optimize=True); made += 1
              print('thumbnails generated:', made)
          except Exception as e:
              print('thumbnail step skipped:', e)
          PY
          (cd _pack && zip -qr ../_site/embed/esm-backdrop-pack.zip esm-backdrop) && ls -la _site/embed/esm-backdrop-pack.zip
          # per-image background motion for any slide that doesn't have one yet
          python3 tools/make_motion.py --slides _site/assets/slides --out _site/assets/motion.json --only-missing \
            || echo "motion step skipped (numpy/Pillow missing) — slides without an entry use the fallback drift"
          cat > _site/version.json <<EOF
          {
            "version": "code-$(cat app.js shared.js wall-background.js styles.css index.html | sha1sum | cut -c1-10)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "note": "version = hash of screen code; display selections are read credential-free from authenticated Scale OS output."
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
